defaults:
  - data: default
  - sae: default
  - train: default
  - logging: default
  - evaluation: default
  - _self_

seed: 42
model_name: gpt2-small
layer: 10
factorization_mode: residual

hydra:
  job:
    chdir: false
  run:
    dir: ${hydra:runtime.cwd}/experiments/vanilla_sae/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${hydra:runtime.cwd}/experiments/vanilla_sae/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
